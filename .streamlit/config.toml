# Visual theme for the AI Revenue Recovery dashboard.
#
# This file is the entire visual overhaul: no custom CSS, no HTML injection,
# no change to any widget's behavior. It only sets colors, fonts, radii, and
# borders through Streamlit's own theming engine, so every interactive
# element (filters, the case-selection dataframe on Page 2, buttons, the
# case selector on Page 3) keeps working exactly as before — this file
# cannot change how the app behaves, only how it looks.
#
# Locked to light mode (base = "light") so the look is identical regardless
# of a viewer's OS/browser dark-mode preference — no risk of a half-styled
# fallback if a judge's machine prefers dark.

[theme]
base = "light"

primaryColor = "#4F46E5"
backgroundColor = "#FCFCFF"
secondaryBackgroundColor = "#EEF0FA"
textColor = "#1E1B2E"
borderColor = "#DADCF0"

font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap, sans-serif"

baseRadius = "1rem"
buttonRadius = "0.75rem"
showWidgetBorder = true

dataframeBorderColor = "#DADCF0"
dataframeHeaderBackgroundColor = "#EEF0FA"

metricValueFontSize = "1.65rem"
metricValueFontWeight = 700

# Applies automatically to any Plotly/Altair chart that doesn't hardcode its
# own per-trace colors. The dashboard's charts mostly set explicit colors
# already (Sankey nodes, the status pie), so this mainly keeps anything
# left to Streamlit's defaults consistent with the rest of the palette.
chartCategoricalColors = [
    "#4F46E5", "#7C3AED", "#0EA5E9", "#14B8A6", "#F59E0B",
    "#F43F5E", "#84CC16", "#8B5CF6", "#06B6D4", "#94A3B8",
]

# A distinct dark-indigo sidebar against the light content area — the
# single biggest lever for reading as "designed" rather than the default
# two-tone grey Streamlit look. Any color left unset here inherits from
# [theme] above, so only what needs to differ is listed.
[theme.sidebar]
backgroundColor = "#1E1B4B"
secondaryBackgroundColor = "#2E2A6B"
textColor = "#E8E7F7"
primaryColor = "#A5B4FC"
borderColor = "#3D3875"
